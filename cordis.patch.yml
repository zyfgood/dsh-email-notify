# @zyfgood/dsh-email-notify bundle patch
#
# 通过官方 CLI 安装时——
#
#   dsh plugin --profile <name> add @zyfgood/dsh-email-notify
#
# ——CLI 会把本包加入 profile 的 bundle 栈；profile 启动时合并本 patch：
# 插入 email-notify 插件行，注册 email_send（发信）与 email_check（收信）
# 两个模型工具。IMAP 主机默认从 host 推导（smtp.* → imap.*，端口 993），
# 可用 imapHost/imapPort/imapSecure 覆盖。
# profile 自己的 cordis.patch.yml 在本 patch 之后合并，按 id 覆盖即可定制
# （例如换 host 或加默认收件人）。
#
# 启动前请在 %USERPROFILE%/.dsh/.env（Windows）或 ~/.dsh/.env 配置
# （loadLayeredEnv 注入，密钥不落盘；邮箱「授权码」对 SMTP/IMAP 同时有效）：
#   SMTP_USER=发件邮箱
#   SMTP_PASS=SMTP 授权码（非登录密码）
#
# host 按发件域名调整：yeah.net→smtp.yeah.net，163→smtp.163.com，
# 126→smtp.126.com，qq/foxmail→smtp.qq.com；其余按 smtp.<域名> 兜底。
# 默认值以网易系（yeah.net）为例，非网易邮箱请按 id 覆盖 host。
- insert:
    - id: email-notify
      name: '@zyfgood/dsh-email-notify'
      config:
        host: 'smtp.yeah.net'
        port: 465
        secure: true
        user: 'env:SMTP_USER'
        pass: 'env:SMTP_PASS'
        # to: someone@example.com   # 可选默认收件人；不配置则发给 SMTP_USER 自己
